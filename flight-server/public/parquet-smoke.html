<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>parquet-wasm smoke test</title>
  <style>
    :root { --bg: #1a1a2e; --surface: #16213e; --text: #eaeaea; --muted: #888; --green: #4caf50; --red: #f44336; }
    body { font-family: monospace; background: var(--bg); color: var(--text); padding: 2rem; }
    .step { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; }
    .step.ok { color: var(--green); }
    .step.err { color: var(--red); }
    .step.wait { color: var(--muted); }
    #output { white-space: pre-wrap; font-size: 0.85rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h2>parquet-wasm smoke test</h2>
  <div id="log"></div>

<script type="importmap">
{
  "imports": {
    "parquet-wasm": "https://cdn.jsdelivr.net/npm/parquet-wasm@0.6.1/esm/+esm",
    "apache-arrow": "https://cdn.jsdelivr.net/npm/apache-arrow@20.0.0/+esm",
    "arrow-js-ffi": "https://cdn.jsdelivr.net/npm/arrow-js-ffi@0.6.0/+esm"
  }
}
</script>

<script type="module">
import wasmInit, { ParquetFile } from "parquet-wasm";
import { tableFromIPC } from "apache-arrow";

const log = document.getElementById("log");
function step(msg, cls = "wait") {
  const d = document.createElement("div");
  d.className = `step ${cls}`;
  d.textContent = msg;
  log.appendChild(d);
  console.log(`[${cls}] ${msg}`);
}

const R2_URL = "https://pub-a0dfcedd4df848e5bfca15cca210aea5.r2.dev/2024/Q1/loans.parquet";

try {
  step("Loading WASM...");
  await wasmInit();
  step("WASM loaded (1.2 MB brotli)", "ok");

  step(`Opening remote: loans.parquet (40 MB on R2)...`);
  const file = await ParquetFile.fromUrl(R2_URL);
  step("Metadata loaded!", "ok");

  const meta = file.metadata();
  const fm = meta.fileMetadata();
  step(`Rows: ${fm.numRows()?.toLocaleString()}`, "ok");
  step(`Row groups: ${meta.numRowGroups()}`, "ok");

  step("Reading first 10 rows (no column filter)...");
  const t0 = performance.now();
  const wasmTable = await file.read({
    limit: 10,
  });
  const ms = (performance.now() - t0).toFixed(0);

  step(`Read returned, IPC stream...`, "ok");
  const buf = wasmTable.intoIPCStream();
  step(`IPC stream: ${buf.length} bytes`, "ok");
  const table = tableFromIPC(buf);
  step(`Parsed! ${table.numRows} rows in ${ms}ms`, "ok");

  const names = table.schema.fields.map(f => f.name);
  step(`Schema (${names.length} cols): ${names.join(", ")}`, "ok");

  // Show data
  let preview = names.join("\t") + "\n";
  for (let r = 0; r < Math.min(table.numRows, 10); r++) {
    preview += names.map(n => String(table.getChild(n)?.get(r) ?? "NULL")).join("\t") + "\n";
  }
  step(`\n${preview}`, "ok");

  step("✅ All checks passed!", "ok");

} catch (e) {
  step(`FAILED: ${e.message || e}`, "err");
  console.error(e);
}
</script>
</body>
</html>
