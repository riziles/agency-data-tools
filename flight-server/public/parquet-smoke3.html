<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>parquet-wasm FFI test</title>
  <style>
    :root { --bg: #1a1a2e; --surface: #16213e; --text: #eaeaea; --muted: #888; --green: #4caf50; --red: #f44336; }
    body { font-family: monospace; background: var(--bg); color: var(--text); padding: 2rem; }
    .step { margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; }
    .step.ok { color: var(--green); } .step.err { color: var(--red); } .step.wait { color: var(--muted); }
  </style>
</head>
<body>
  <h2>parquet-wasm — FFI test (zero-copy)</h2>
  <div id="log"></div>

<script type="importmap">
{
  "imports": {
    "parquet-wasm": "https://cdn.jsdelivr.net/npm/parquet-wasm@0.6.1/esm/+esm",
    "arrow-js-ffi": "https://cdn.jsdelivr.net/npm/arrow-js-ffi@0.4.3/dist/arrow-js-ffi.es.mjs"
  }
}
</script>

<script type="module">
import wasmInit, { ParquetFile, wasmMemory } from "parquet-wasm";
import { parseTable } from "arrow-js-ffi";

const log = document.getElementById("log");
function step(msg, cls = "wait") {
  const d = document.createElement("div");
  d.className = `step ${cls}`;
  d.textContent = msg;
  log.appendChild(d);
}

const R2_URL = "https://pub-a0dfcedd4df848e5bfca15cca210aea5.r2.dev/2024/Q1/loans.parquet";

try {
  step("Loading WASM...");
  await wasmInit();
  const memory = wasmMemory();
  step("WASM loaded", "ok");

  step("Opening remote parquet...");
  const file = await ParquetFile.fromUrl(R2_URL);
  step("Connected", "ok");

  step("Reading 5 rows...");
  const wasmTable = await file.read({ limit: 5 });
  step("Read complete", "ok");

  step("Converting via FFI...");
  const ffiTable = wasmTable.intoFFI();
  step(`FFI: schema=${ffiTable.schemaAddr()} arrays=${ffiTable.arrayAddrs().length}`, "ok");

  const table = parseTable(memory.buffer, ffiTable.arrayAddrs(), ffiTable.schemaAddr());
  ffiTable.free();

  const names = table.schema.fields.map(f => f.name);
  step(`Success! ${table.numRows} rows, ${names.length} columns`, "ok");
  step(`First 20 cols: ${names.slice(0, 20).join(", ")}...`, "ok");

  // Show sample data (first 5 cols)
  const firstCols = names.slice(0, 5);
  let preview = firstCols.join(" | ") + "\n";
  for (let r = 0; r < Math.min(table.numRows, 5); r++) {
    const row = firstCols.map(n => String(table.getChild(n)?.get(r) ?? "NULL")).join(" | ");
    preview += `  ${row}\n`;
  }
  step(`\n${preview}`, "ok");

  step("✅ Done!", "ok");
} catch (e) {
  step(`FAILED: ${e.message || e}`, "err");
  console.error(e);
}
</script>
</body>
</html>
